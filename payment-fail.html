<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GRVN 결제 실패</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #05050a;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: min(520px, 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 32px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 38px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff4edb, #7a5cff);
            font-weight: 900;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            line-height: 1.25;
        }

        p {
            margin: 8px 0;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.6;
        }

        .info {
            margin-top: 22px;
            padding: 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin: 8px 0;
        }

        .label {
            color: rgba(255, 255, 255, 0.56);
        }

        .value {
            color: #fff;
            font-weight: 700;
            text-align: right;
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        a,
        button {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 13px 18px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .primary {
            background: linear-gradient(135deg, #ff4edb, #7a5cff);
            color: white;
        }

        .secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">GRVN</div>

        <h1>결제가 완료되지 않았습니다.</h1>
        <p>결제가 취소되었거나 실패했습니다.</p>
        <p>다시 시도하거나, 문제가 반복되면 관리자에게 문의해주세요.</p>

        <div class="info">
            <div class="row">
                <span class="label">에러 코드</span>
                <span class="value" id="code">-</span>
            </div>
            <div class="row">
                <span class="label">에러 메시지</span>
                <span class="value" id="message">-</span>
            </div>
            <div class="row">
                <span class="label">주문번호</span>
                <span class="value" id="orderId">-</span>
            </div>
        </div>

        <div class="actions">
            <button class="primary" type="button" onclick="history.back()">다시 결제하기</button>
            <a class="secondary" href="/index.html">쇼핑 페이지로 이동</a>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);

        const code = params.get('code') || params.get('errorCode') || '-';
        const message = params.get('message') || params.get('errorMessage') || '결제가 취소되었거나 실패했습니다.';
        const orderId = params.get('orderId') || params.get('order_no') || params.get('paymentId') || '-';

        document.getElementById('code').textContent = code;
        document.getElementById('message').textContent = message;
        document.getElementById('orderId').textContent = orderId;
    </script>
</body>

</html>
