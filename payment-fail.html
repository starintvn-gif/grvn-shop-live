<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>결제 실패 | GRVN</title>
    <meta name="description" content="GRVN 결제 실패 안내 페이지" />
    <link rel="stylesheet" href="/styles.css?v=20260627-payment-result-v1" />
</head>

<body>
    <main class="page legal-page payment-result-page">
        <section class="payment-result-card">
            <p class="eyebrow">PAYMENT FAILED</p>

            <h1>결제가 완료되지 않았습니다</h1>

            <p class="muted">
                결제 중 취소되었거나 일시적인 오류가 발생했습니다.
                아래 내용을 확인한 뒤 다시 시도해주세요.
            </p>

            <section class="detail-section payment-result-detail">
                <h2>실패 정보</h2>

                <p>
                    <strong>오류 코드</strong>
                    <span id="errorCode">-</span>
                </p>

                <p>
                    <strong>오류 메시지</strong>
                    <span id="errorMessage">-</span>
                </p>
            </section>

            <section class="detail-section payment-result-guide">
                <h2>안내사항</h2>
                <p>
                    결제가 실제로 승인되었는지 애매한 경우, 중복 결제 방지를 위해 먼저 주문 상태를 확인해주세요.
                </p>
                <p>
                    반복적으로 결제가 실패하면 다른 결제수단을 사용하거나 고객센터로 문의해주세요.
                </p>
            </section>

            <div class="payment-result-actions">
                <a class="btn primary" href="javascript:history.back()">다시 결제하기</a>
                <a class="btn dark" href="/">메인으로 돌아가기</a>
            </div>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);

        document.getElementById('errorCode').textContent =
            params.get('code') || '-';

        document.getElementById('errorMessage').textContent =
            params.get('message') || '결제가 취소 또는 실패되었습니다.';
    </script>
</body>

</html>
