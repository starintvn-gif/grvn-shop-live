<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>결제 실패 | GRVN</title>
    <meta name="description" content="GRVN 결제 실패 안내 페이지" />
    <link rel="stylesheet" href="/styles.css?v=20260620-footer-compact-v1" />
</head>

<body>
    <main class="page legal-page">
        <h1>결제가 완료되지 않았습니다</h1>
        <p class="muted">
            결제가 취소되었거나 실패했습니다. 아래 내용을 확인한 뒤 다시 시도해주세요.
        </p>

        <section class="detail-section">
            <h2>실패 정보</h2>
            <p><strong>오류 코드</strong>: <span id="errorCode">-</span></p>
            <p><strong>오류 메시지</strong>: <span id="errorMessage">-</span></p>
        </section>

        <p>
            <a class="btn primary" href="javascript:history.back()">이전 페이지로 돌아가기</a>
            <a class="btn" href="/">메인으로 돌아가기</a>
        </p>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);

        document.getElementById('errorCode').textContent =
            params.get('code') || '-';

        document.getElementById('errorMessage').textContent =
            params.get('message') || '결제가 취소 또는 실패되었습니다.';
    </script>
</body>

</html>
