<!DOCTYPE html>
<!-- saved from url=(0080)file:///C:/Users/USER/Downloads/v1_salon_de_seoul_layout_reset_fix/v1/index.html -->
<html lang="ko">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRVN 숏폼 커머스</title>
  <meta name="description" content="숏폼 영상 중심으로 제품 발견부터 구매 랜딩까지 연결되는 스타인티비 숏폼 커머스 플랫폼">
  <link rel="stylesheet" href="/styles.css?v=20260529-video-fix" />
</head>

<body>
  <a class="skip-link" href="#main">본문
    바로가기</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="GRVN 홈">
      <span class="brand-mark" aria-hidden="true">GRVN</span>
    </a>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="#shop">숏폼 쇼핑</a>
      <a href="./influencer-dashboard.html" target="_blank" rel="noopener">인플 접속</a>
      <a href="./admin.html" target="_blank" rel="noopener">관리자</a>
    </nav>
  </header>

  <main id="main" class="page">
    <section class="hero-split" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">VIDEO-FIRST SHOPPING PLATFORM</p>
        <h1 id="hero-title">content-commerce platform</h1>

        <a class="btn primary" href="#shop">숏폼 쇼핑 시작</a>
      </div>
      <aside class="hero-panel" aria-label="플랫폼 요약">
        <div class="kpi-grid">
          <div><strong>4</strong><span>영상 카드</span></div>
          <div><strong>20</strong><span>PIP 연결 상품</span></div>
          <div><strong>새창</strong><span>의상별 상세 랜딩</span></div>
        </div>
      </aside>
    </section>

    <section id="shop" class="shop-section" aria-labelledby="shop-title">
      <p class="eyebrow">SHOP BY SHORT-FORM</p>
      <div class="section-head">
        <h2 id="shop-title">인플루언서별 숏폼 피드</h2>
        <label class="search-label">인플루언서, 상품명, 상품군 검색
          <input id="search" type="search" placeholder="예: 이우정, 원피스, 블라우스" autocomplete="off">
        </label>
      </div>
      <div class="filter-block">
        <p class="filter-label">인플루언서별 영상</p>
        <div id="influencerTabs" class="tabs" role="tablist" aria-label="인플루언서 영상 필터"><button class="tab" type="button"
            data-filter-kind="influencer" data-value="all" aria-selected="true">전체</button><button class="tab"
            type="button" data-filter-kind="influencer" data-value="이우정" aria-selected="false">이우정</button><button
            class="tab" type="button" data-filter-kind="influencer" data-value="박혜훈"
            aria-selected="false">박혜훈</button><button class="tab" type="button" data-filter-kind="influencer"
            data-value="김보경" aria-selected="false">김보경</button><button class="tab" type="button"
            data-filter-kind="influencer" data-value="송지은" aria-selected="false">송지은</button></div>
      </div>
      <div class="filter-block">
        <p class="filter-label">영상 속 상품군</p>
        <div id="typeTabs" class="tabs" role="tablist" aria-label="상품군 필터"><button class="tab small-tab" type="button"
            data-filter-kind="type" data-value="all" aria-selected="true">전체</button><button class="tab small-tab"
            type="button" data-filter-kind="type" data-value="원피스" aria-selected="false">원피스</button><button
            class="tab small-tab" type="button" data-filter-kind="type" data-value="팬츠"
            aria-selected="false">팬츠</button><button class="tab small-tab" type="button" data-filter-kind="type"
            data-value="스커트" aria-selected="false">스커트</button><button class="tab small-tab" type="button"
            data-filter-kind="type" data-value="블라우스" aria-selected="false">블라우스</button><button class="tab small-tab"
            type="button" data-filter-kind="type" data-value="니트/베스트" aria-selected="false">니트/베스트</button><button
            class="tab small-tab" type="button" data-filter-kind="type" data-value="아우터"
            aria-selected="false">아우터</button></div>
      </div>
      <div id="feed" class="feed-grid" aria-live="polite"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    window.GRVN_API_BASE = "https://api.grvn.shop";
  </script>
  <script src="/data.js?v=20260529-video-fix"></script>
  <script src="/shop.js?v=20260614-media-fields-v1"></script>
</body>

</html>
