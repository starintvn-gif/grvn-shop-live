<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>결제 승인 처리 중 | GRVN</title>
    <meta name="description" content="GRVN 결제 승인 처리 페이지" />
    <link rel="stylesheet" href="/styles.css?v=20260627-payment-result-v1" />
</head>

<body>
    <main class="page legal-page payment-result-page">
        <section class="payment-result-card">
            <p class="eyebrow">PAYMENT COMPLETE</p>

            <h1 id="resultTitle">결제 승인 처리 중입니다</h1>

            <p id="resultMessage" class="muted">
                결제 정보를 확인하고 있습니다. 잠시만 기다려주세요.
            </p>

            <section class="detail-section payment-result-detail">
                <h2>주문 정보</h2>

                <p>
                    <strong>주문번호</strong>
                    <span id="orderIdText">-</span>
                </p>

                <p>
                    <strong>결제금액</strong>
                    <span id="amountText">-</span>
                </p>

                <p>
                    <strong>결제키</strong>
                    <span id="paymentKeyText">-</span>
                </p>
            </section>

            <section class="detail-section payment-result-guide">
                <h2>안내사항</h2>
                <p>
                    주문 확인 및 배송 관련 안내는 입력하신 연락처 기준으로 진행됩니다.
                </p>
                <p>
                    결제 또는 주문 확인이 필요한 경우 주문번호를 기준으로 문의해주세요.
                </p>
            </section>

            <div class="payment-result-actions">
                <a class="btn primary" href="/">메인으로 돌아가기</a>
                <a class="btn dark" href="/product-landing.html">상품 페이지로 돌아가기</a>
            </div>
        </section>
    </main>

    <script>
        window.GRVN_API_BASE = "https://api.grvn.shop";

        function money(value) {
            return '₩' + Number(value || 0).toLocaleString('ko-KR');
        }

        async function confirmPayment() {
            const params = new URLSearchParams(window.location.search);

            const paymentKey = params.get('paymentKey');
            const orderId = params.get('orderId');
            const amount = Number(params.get('amount'));

            document.getElementById('paymentKeyText').textContent = paymentKey || '-';
            document.getElementById('orderIdText').textContent = orderId || '-';
            document.getElementById('amountText').textContent = amount ? money(amount) : '-';

            if (!paymentKey || !orderId || !amount) {
                document.getElementById('resultTitle').textContent = '결제 정보가 올바르지 않습니다';
                document.getElementById('resultMessage').textContent =
                    'paymentKey, orderId, amount 값이 누락되었습니다.';
                return;
            }

            const confirmKey = `grvn_confirmed_${paymentKey}`;

            if (sessionStorage.getItem(confirmKey) === 'ok') {
                document.getElementById('resultTitle').textContent = '결제가 완료되었습니다';
                document.getElementById('resultMessage').textContent =
                    '이미 승인 확인이 완료된 결제입니다. 주문은 정상적으로 접수되어 있습니다.';
                return;
            }

            let lastOrder = null;

            try {
                const lastOrderRaw = sessionStorage.getItem('grvn_last_order');
                lastOrder = lastOrderRaw ? JSON.parse(lastOrderRaw) : null;
            } catch (error) {
                console.warn('[GRVN] sessionStorage 주문 정보 파싱 실패:', error);
            }

            try {
                const res = await fetch(window.GRVN_API_BASE + '/api/payments/confirm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        paymentKey,
                        orderId,
                        amount,
                        lastOrder
                    })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    console.error('[GRVN] 결제 승인 응답:', data);

                    const message = data.message || data.error || '';

                    if (
                        message.includes('이미 처리된 결제') ||
                        message.includes('이미 처리') ||
                        message.includes('ALREADY_PROCESSED')
                    ) {
                        sessionStorage.setItem(confirmKey, 'ok');

                        document.getElementById('resultTitle').textContent = '결제가 완료되었습니다';
                        document.getElementById('resultMessage').textContent =
                            '이미 승인 처리된 결제입니다. 주문은 정상적으로 접수되어 있습니다.';
                        return;
                    }

                    document.getElementById('resultTitle').textContent = '결제 승인에 실패했습니다';
                    document.getElementById('resultMessage').textContent =
                        message || '결제 승인 중 문제가 발생했습니다. 고객센터로 문의해주세요.';
                    return;
                }

                console.log('[GRVN] 결제 승인 성공:', data);

                sessionStorage.setItem(confirmKey, 'ok');

                document.getElementById('resultTitle').textContent = '결제가 완료되었습니다';
                document.getElementById('resultMessage').textContent =
                    '주문이 정상적으로 접수되었습니다. 배송 및 상품 관련 안내는 입력하신 연락처 기준으로 진행됩니다.';

            } catch (error) {
                console.error('[GRVN] 결제 승인 요청 오류:', error);

                document.getElementById('resultTitle').textContent = '결제 승인 요청 중 오류가 발생했습니다';
                document.getElementById('resultMessage').textContent =
                    '네트워크 또는 서버 연결 문제로 결제 승인 확인에 실패했습니다. 고객센터로 문의해주세요.';
            }
        }

        confirmPayment();
    </script>
</body>

</html>
