<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GRVN 결제 완료</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #05050a;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: min(520px, 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 32px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 38px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff4edb, #7a5cff);
            font-weight: 900;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            line-height: 1.25;
        }

        p {
            margin: 8px 0;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.6;
        }

        .info {
            margin-top: 22px;
            padding: 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin: 8px 0;
        }

        .label {
            color: rgba(255, 255, 255, 0.56);
        }

        .value {
            color: #fff;
            font-weight: 700;
            text-align: right;
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        a,
        button {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 13px 18px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .primary {
            background: linear-gradient(135deg, #ff4edb, #7a5cff);
            color: white;
        }

        .secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">GRVN</div>

        <h1>결제가 완료되었습니다.</h1>
        <p>주문 및 결제 정보가 정상적으로 처리되었습니다.</p>
        <p>아래 정보는 결제 완료 후 전달된 값입니다.</p>

        <div class="info">
            <div class="row">
                <span class="label">주문번호</span>
                <span class="value" id="orderId">-</span>
            </div>
            <div class="row">
                <span class="label">결제키</span>
                <span class="value" id="paymentKey">-</span>
            </div>
            <div class="row">
                <span class="label">결제금액</span>
                <span class="value" id="amount">-</span>
            </div>
        </div>

        <div class="actions">
            <a class="primary" href="/index.html">쇼핑 페이지로 이동</a>
            <a class="secondary" href="/influencer-dashboard.html">인플 대시보드</a>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);

        const orderId = params.get('orderId') || params.get('order_no') || params.get('paymentId') || '-';
        const paymentKey = params.get('paymentKey') || params.get('payment_id') || '-';
        const amount = params.get('amount');

        document.getElementById('orderId').textContent = orderId;
        document.getElementById('paymentKey').textContent = paymentKey;
        document.getElementById('amount').textContent = amount ? Number(amount).toLocaleString() + '원' : '-';
    </script>
</body>

</html>
