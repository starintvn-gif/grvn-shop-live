<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>결제 완료 | GRVN</title>
    <meta name="description" content="GRVN 결제 완료 및 주문 확인 페이지" />
    <link rel="stylesheet" href="/styles.css?v=20260627-payment-result-v1" />
</head>

<body>
    <main class="page legal-page payment-result-page">
        <section class="payment-result-card">
            <p class="eyebrow">PAYMENT COMPLETE</p>

            <h1 id="resultTitle">결제가 완료되었습니다</h1>

            <p id="resultMessage" class="muted">
                주문 및 결제 상태를 확인하고 있습니다. 잠시만 기다려주세요.
            </p>

            <section class="detail-section payment-result-detail">
                <h2>주문 정보</h2>

                <p>
                    <strong>주문번호</strong>
                    <span id="orderIdText">-</span>
                </p>

                <p>
                    <strong>결제금액</strong>
                    <span id="amountText">-</span>
                </p>

                <p>
                    <strong>결제 상태</strong>
                    <span id="paymentStatusText">확인 완료</span>
                </p>
            </section>

            <section class="detail-section payment-result-guide">
                <h2>안내사항</h2>
                <p>
                    주문 확인 및 배송 관련 안내는 입력하신 연락처 기준으로 진행됩니다.
                </p>
                <p>
                    결제 또는 주문 확인이 필요한 경우 주문번호를 기준으로 문의해주세요.
                </p>
            </section>

            <div class="payment-result-actions">
                <a class="btn primary" href="/">메인으로 돌아가기</a>
                <a class="btn dark" href="/product-landing.html">상품 페이지로 돌아가기</a>
            </div>
        </section>
    </main>

    <script>
        window.GRVN_API_BASE = "https://api.grvn.shop";

        function money(value) {
            return '₩' + Number(value || 0).toLocaleString('ko-KR');
        }

        async function loadPaymentResult() {
            const params = new URLSearchParams(window.location.search);

            const orderNo = params.get('orderNo');
            const verified = params.get('verified');

            const orderIdText = document.getElementById('orderIdText');
            const amountText = document.getElementById('amountText');
            const paymentStatusText = document.getElementById('paymentStatusText');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');

            if (!orderNo) {
                resultTitle.textContent = '주문 정보를 확인할 수 없습니다';
                resultMessage.textContent =
                    '주문번호가 누락되었습니다. 고객센터로 문의해주세요.';

                if (orderIdText) {
                    orderIdText.textContent = '-';
                }

                if (amountText) {
                    amountText.textContent = '-';
                }

                if (paymentStatusText) {
                    paymentStatusText.textContent = '확인 불가';
                }

                return;
            }

            if (orderIdText) {
                orderIdText.textContent = orderNo;
            }

            if (verified !== '1') {
                resultTitle.textContent = '결제 확인이 필요합니다';
                resultMessage.textContent =
                    '정상적인 결제 완료 경로가 아닙니다. 주문 상태를 확인해주세요.';

                if (paymentStatusText) {
                    paymentStatusText.textContent = '확인 필요';
                }
            }

            try {
                const res = await fetch(
                    `${window.GRVN_API_BASE}/api/orders/${encodeURIComponent(orderNo)}`
                );

                const data = await res.json();

                if (!res.ok || !data.success || !data.order) {
                    throw new Error(
                        data.error ||
                        '주문 정보를 불러오지 못했습니다.'
                    );
                }

                const order = data.order;

                if (amountText) {
                    amountText.textContent = money(order.payment_total);
                }

                if (paymentStatusText) {
                    paymentStatusText.textContent =
                        String(order.status || '').toLowerCase() === 'paid'
                            ? '결제 완료'
                            : order.status || '확인 필요';
                }

                if (String(order.status || '').toLowerCase() === 'paid') {
                    resultTitle.textContent = '결제가 완료되었습니다';
                    resultMessage.textContent =
                        '주문이 정상적으로 접수되었습니다. 배송 및 상품 관련 안내는 주문 처리 기준에 따라 진행됩니다.';
                } else {
                    resultTitle.textContent = '주문 상태를 확인해주세요';
                    resultMessage.textContent =
                        `현재 주문 상태는 ${order.status || '확인 중'}입니다.`;
                }

            } catch (error) {
                console.error('[GRVN] 주문 결과 조회 오류:', error);

                resultTitle.textContent = '주문 정보 확인 중 오류가 발생했습니다';
                resultMessage.textContent =
                    '결제 완료 후 주문정보 조회에 문제가 발생했습니다. 주문번호를 기준으로 고객센터에 문의해주세요.';

                if (paymentStatusText) {
                    paymentStatusText.textContent = '조회 오류';
                }
            }
        }

        loadPaymentResult();
    </script>
</body>

</html>
